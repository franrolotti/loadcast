# Every day: forecast tomorrow with the runs listed in live.yaml, record the job on
# the `data` branch and redeploy the dashboard to GitHub Pages. A push that changes
# live.yaml or the dashboard runs it again: pairs that already forecast tomorrow are
# not forecast twice.
name: Daily forecast

on:
  schedule:
    - cron: "20 9 * * *"  # just after the 09:00 UTC issue time (SPEC.md §2)
  push:
    branches: [main]
    paths: [live.yaml, src/loadcast/dashboard.py, src/loadcast/dashboard.html, results/metrics_*.csv]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ENTSOE_API_KEY is an environment secret of github-pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the live record (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: history
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Download the runs listed in live.yaml
        run: uv run loadcast fetch

      - name: Forecast tomorrow
        run: uv run loadcast forecast

      - name: Commit the job to the data branch
        if: always()
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(data): daily job $(date -u +%F)"
          git push

      - name: Build dashboard
        if: always()
        run: uv run loadcast dashboard
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - id: deployment
        if: always()
        uses: actions/deploy-pages@v4
