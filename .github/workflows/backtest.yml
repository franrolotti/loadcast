# On demand: full expanding-window backtest (config.yaml), then commit results/.
name: Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        country: [ES, DE, FR]
    environment: github-pages  # holds the ENTSOE_API_KEY secret
    env:
      ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ matrix.country }}-${{ github.run_id }}
          restore-keys: raw-${{ matrix.country }}-
      - run: uv run loadcast download --country ${{ matrix.country }}
      - run: uv run loadcast build --country ${{ matrix.country }}
      - run: uv run loadcast backtest --country ${{ matrix.country }}
      - uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ matrix.country }}
          path: results/predictions/

  report:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: predictions-*
          merge-multiple: true
          path: results/predictions
      - run: uv run loadcast report
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/RESULTS.md results/*.csv results/figures
          git diff --cached --quiet || git commit -m "results: backtest $(date -u +%F)"
          git push
