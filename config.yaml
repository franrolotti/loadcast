# loadcast configuration. Every experiment in results/ is fully defined by this file.

data:
  start: "2018-01-01"            # first day downloaded (UTC)
  end: "2024-12-31"              # last day downloaded (UTC, inclusive)
  raw_dir: data/raw
  processed_dir: data/processed

# Day-ahead set-up: forecasts for UTC day D are issued at `issue_hour_utc` on D-1,
# before the day-ahead market gate closure (12:00 CET). Only information observed
# before the issue time may be used (see SPEC.md §2).
forecast:
  issue_hour_utc: 9
  horizon_hours: 24
  lookback_hours: 168            # history window seen by the sequence models
  quantiles: [0.1, 0.5, 0.9]

# Expanding-window backtest: for every test year, models are trained on all data
# before it; the last `validation_days` of that period are used for early stopping.
backtest:
  test_years: [2022, 2023, 2024]
  validation_days: 90

# Training runs (`make train`, SPEC.md §10b): the last `test_days` before the end of
# the data are held out of training and early stopping, so every run is scored on days
# its models never saw. The published models are the ones scored (not refitted).
training:
  test_days: 30

models: [seasonal_naive, tso, vanilla_mlr, xgboost, lstm, transformer]

xgboost:
  n_estimators: 2000
  learning_rate: 0.03
  max_depth: 8
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 100

# Shared optimisation settings for the PyTorch models.
torch:
  batch_size: 64
  max_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  seed: 42

lstm:
  hidden_size: 128
  num_layers: 2
  dropout: 0.1

transformer:
  d_model: 64
  n_heads: 4
  n_layers: 2
  patch_len: 24                  # 1 = one token per hour; 24 = one token per day
  dropout: 0.1

# Countries are ENTSO-E area codes. Weather is a population-weighted average over
# the listed cities (approximate metropolitan populations, in millions, used only
# as weights).
countries:
  ES:
    timezone: Europe/Madrid
    cities:
